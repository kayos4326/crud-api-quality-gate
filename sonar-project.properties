sonar.projectKey=crud-api
sonar.projectName=Campus CRUD API

# Scan project source only.
sonar.sources=.
sonar.exclusions=node_modules/**,dist/**,coverage/**,prisma/migrations/**,tests/**

# Treat test files separately from production code.
sonar.tests=tests
sonar.test.inclusions=tests/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
