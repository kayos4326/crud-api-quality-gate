sonar.projectKey=crud-api
sonar.projectName=Campus CRUD API

# Skip generated and downloaded files.
sonar.sources=.
sonar.exclusions=node_modules/**,dist/**,coverage/**,prisma/migrations/**,tests/**

# Keep test results separate from the app code.
sonar.tests=tests
sonar.test.inclusions=tests/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
