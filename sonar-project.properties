sonar.projectKey=crud-api
sonar.projectName=Campus CRUD API

# Analyse our own source only.
sonar.sources=.
sonar.exclusions=node_modules/**,dist/**,coverage/**,prisma/migrations/**,tests/**

# Test files are analysed as tests, not as production code.
sonar.tests=tests
sonar.test.inclusions=tests/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
