<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52606d"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1180" height="700" fill="#ffffff"/>

  <text x="40" y="44" font-size="21" font-weight="600" fill="#1f2933">A quality gate in front of deploy.sh</text>
  <text x="40" y="68" font-size="14" fill="#52606d">The same pipeline from Week 5, with SonarQube deciding whether anything is allowed to reach the VM.</text>

  <!-- Laptop boundary -->
  <rect x="34" y="96" width="600" height="360" rx="12" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="54" y="122" font-size="13" font-weight="600" fill="#52606d">LOCAL MACHINE</text>

  <rect x="56" y="140" width="140" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="126" cy="168" r="12" fill="#52606d"/><path d="M108 198 a18 18 0 0 1 36 0 z" fill="#52606d"/>
  <text x="126" y="214" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Developer</text>

  <path d="M202 180 L248 180" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <text x="225" y="171" font-size="12" fill="#52606d" text-anchor="middle">runs</text>

  <rect x="256" y="140" width="150" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="331" y="168" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">./deploy.sh</text>
  <text x="331" y="190" font-size="12" fill="#7b8794" text-anchor="middle">Step 0 = the gate</text>
  <text x="331" y="208" font-size="12" fill="#7b8794" text-anchor="middle">Steps 1-2 = scp + ssh</text>

  <path d="M412 180 L458 180" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>

  <rect x="466" y="132" width="150" height="96" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="541" y="158" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">sonar-scanner</text>
  <text x="541" y="180" font-size="12" fill="#52606d" text-anchor="middle">uploads app.js,</text>
  <text x="541" y="197" font-size="12" fill="#52606d" text-anchor="middle">reporting.js, Dockerfile</text>
  <text x="541" y="216" font-size="12" fill="#52606d" text-anchor="middle">prisma, compose</text>

  <!-- SonarQube -->
  <rect x="682" y="96" width="248" height="200" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8"/>
  <text x="806" y="124" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">SonarQube</text>
  <text x="806" y="143" font-size="11.5" fill="#7b8794" text-anchor="middle">Community Build, in Docker</text>
  <line x1="700" y1="156" x2="912" y2="156" stroke="#dbeafe"/>
  <text x="700" y="178" font-size="12" font-weight="600" fill="#52606d">QUALITY GATE</text>
  <text x="700" y="199" font-size="12.5" fill="#1f2933">security rating = A</text>
  <text x="700" y="218" font-size="12.5" fill="#1f2933">reliability rating = A</text>
  <text x="700" y="237" font-size="12.5" fill="#1f2933">0 blocker issues</text>
  <text x="700" y="256" font-size="12.5" fill="#1f2933">0 new issues</text>
  <text x="700" y="275" font-size="12.5" fill="#1f2933">duplication &#8804; 3%</text>

  <path d="M622 180 L674 180" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <path d="M806 302 L806 330 L331 330 L331 228" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="568" y="322" font-size="12.5" fill="#52606d" text-anchor="middle">gate result becomes deploy.sh's exit code</text>

  <!-- Outcomes -->
  <rect x="56" y="356" width="270" height="76" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <circle cx="86" cy="394" r="11" fill="#b91c1c"/><path d="M81 389 l10 10 M91 389 l-10 10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="108" y="388" font-size="13.5" font-weight="600" fill="#7f1d1d">FAILED &#8594; exit 1</text>
  <text x="108" y="408" font-size="12" fill="#991b1b">scp never runs. Nothing leaves</text>
  <text x="108" y="424" font-size="12" fill="#991b1b">the laptop.</text>

  <rect x="348" y="356" width="268" height="76" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="378" cy="394" r="11" fill="#15803d"/><path d="M372 394 l4.5 4.5 l8 -9" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="388" font-size="13.5" font-weight="600" fill="#14532d">PASSED &#8594; exit 0</text>
  <text x="400" y="408" font-size="12" fill="#166534">Steps 1-2 run: scp the files,</text>
  <text x="400" y="424" font-size="12" fill="#166534">ssh in, pm2 restart.</text>

  <path d="M624 394 L676 394" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Azure VM -->
  <rect x="684" y="336" width="450" height="316" rx="12" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="704" y="362" font-size="13" font-weight="600" fill="#52606d">AZURE VM &#183; Ubuntu 24.04</text>

  <rect x="706" y="378" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="722" y="400" font-size="12.5" font-weight="600" fill="#1f2933">Nginx :443</text>
  <text x="722" y="419" font-size="11.5" fill="#52606d">TLS, reverse proxy</text>

  <path d="M806 442 L806 466" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <text x="820" y="458" font-size="11.5" fill="#7b8794">/api</text>

  <rect x="706" y="472" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="722" y="494" font-size="12.5" font-weight="600" fill="#1f2933">PM2 &#8594; Node :3000</text>
  <text x="722" y="513" font-size="11.5" fill="#52606d">Express + Prisma</text>

  <path d="M806 536 L806 560" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>

  <rect x="706" y="566" width="94" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="753" y="590" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">MySQL</text>
  <text x="753" y="607" font-size="11" fill="#52606d" text-anchor="middle">:3306</text>

  <rect x="812" y="566" width="94" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="859" y="590" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">Redis</text>
  <text x="859" y="607" font-size="11" fill="#52606d" text-anchor="middle">:6379</text>

  <rect x="926" y="378" width="190" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="942" y="400" font-size="12" font-weight="600" fill="#52606d">ALSO ON THE VM</text>
  <text x="942" y="422" font-size="11.5" fill="#1f2933">Azure Key Vault identity</text>
  <text x="942" y="440" font-size="11.5" fill="#1f2933">(Week 9 bootstrap)</text>
  <text x="942" y="466" font-size="11.5" fill="#1f2933">WordPress on :8080</text>
  <text x="942" y="484" font-size="11.5" fill="#1f2933">behind /content</text>
  <text x="942" y="510" font-size="11.5" fill="#1f2933">UFW: 22, 80, 443, 3306</text>
</svg>
