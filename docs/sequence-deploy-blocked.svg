<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52606d"/></marker>
    <marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1040" height="700" fill="#ffffff"/>

  <text x="40" y="44" font-size="21" font-weight="600" fill="#1f2933">A deploy that gets blocked</text>
  <text x="40" y="68" font-size="14" fill="#52606d">feature/sales-reporting, from ./deploy.sh to the abort.</text>

  <g>
    <rect x="44" y="96" width="150" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="119" y="124" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="middle">Developer</text>
    <line x1="119" y1="140" x2="119" y2="588" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

    <rect x="292" y="96" width="150" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="367" y="124" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="middle">deploy.sh</text>
    <line x1="367" y1="140" x2="367" y2="588" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

    <rect x="540" y="96" width="160" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="620" y="124" font-size="13.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">SonarQube</text>
    <line x1="620" y1="140" x2="620" y2="588" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="5 5"/>

    <rect x="812" y="96" width="176" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="900" y="124" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="middle">Azure VM</text>
    <line x1="900" y1="140" x2="900" y2="588" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  </g>

  <path d="M119 184 L359 184" stroke="#52606d" stroke-width="2" marker-end="url(#s)"/>
  <text x="132" y="176" font-size="12.5" fill="#1f2933">1 &#183; ./deploy.sh</text>

  <path d="M367 226 L612 226" stroke="#52606d" stroke-width="2" marker-end="url(#s)"/>
  <text x="380" y="218" font-size="12.5" fill="#1f2933">2 &#183; Step 0 &#8212; scan the working tree</text>

  <path d="M620 262 L692 262 L692 296 L628 296" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#s)"/>
  <text x="606" y="282" font-size="12.5" fill="#1d4ed8" text-anchor="end">3 &#183; apply ~400 JS rules, evaluate the gate</text>

  <rect x="250" y="322" width="520" height="146" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="270" y="346" font-size="12.5" font-weight="600" fill="#7f1d1d">7 issues &#183; 3 of 6 gate conditions failed</text>
  <text x="270" y="368" font-size="12" fill="#991b1b">BLOCKER  jwt.sign() with a literal key (javascript:S6437)</text>
  <text x="270" y="387" font-size="12" fill="#991b1b">MAJOR    hard-coded database password (javascript:S2068)</text>
  <text x="270" y="406" font-size="12" fill="#991b1b">CRITICAL MD5 used for a fingerprint (javascript:S4790)</text>
  <text x="270" y="425" font-size="12" fill="#991b1b">MAJOR    Math.random() for a download token (javascript:S2245)</text>
  <text x="270" y="444" font-size="12" fill="#991b1b">CRITICAL cognitive complexity 34, limit 15 (javascript:S3776)</text>
  <text x="270" y="461" font-size="11.5" fill="#7f1d1d">security rating E &#183; 1 blocker &#183; 7 new issues</text>

  <path d="M612 506 L375 506" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#sr)"/>
  <text x="386" y="498" font-size="12.5" font-weight="600" fill="#b91c1c">4 &#183; QUALITY GATE STATUS: FAILED</text>

  <path d="M367 548 L127 548" stroke="#b91c1c" stroke-width="2" marker-end="url(#sr)"/>
  <text x="139" y="540" font-size="12.5" fill="#b91c1c">5 &#183; DEPLOY ABORTED (exit 1)</text>

  <path d="M380 586 L884 586" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 5"/>
  <circle cx="632" cy="586" r="13" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <path d="M626 580 l12 12 M638 580 l-12 12" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  <text x="632" y="612" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">scp never runs</text>

  <rect x="40" y="636" width="960" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="663" font-size="12.5" fill="#52606d">The VM is never touched. The author fixes the findings and re-runs deploy.sh, and the loop repeats until the gate is green.</text>
</svg>
